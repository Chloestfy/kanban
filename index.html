<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="home">
    <h1 id="main-title">Kanban board</h1>

    <button class="new-board-btn" aria-label="Créer un nouveau tableau">
        Créer tableau
    </button>

    <script>
        document.querySelector(".new-board-btn").addEventListener("click", () => {
            const nomTableau = prompt("Nom du tableau :");
            if (nomTableau) {
                localStorage.setItem("currentBoard", nomTableau);
                window.location.href = "board.html";
            }
        });
    </script>
</body>

</html>
