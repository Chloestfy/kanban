<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Tableau - Mini Trello</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="board-page">

    <header id="board-title" role="heading" aria-level="1" aria-label="Titre du tableau"></header>

    <div class="board-container">

        <div class="board" role="region" aria-labelledby="board-title">

        </div>

        <button class="add-list-btn" aria-label="Ajouter une nouvelle liste">
            + Ajouter une liste
        </button>
    </div>

    <script src="main.js"></script>
    <script>
        const title = localStorage.getItem("currentBoard") || "Tableau sans nom";
        const boardTitle = document.getElementById("board-title");
        boardTitle.textContent = title;
        boardTitle.setAttribute("aria-label", `Tableau : ${title}`);
    </script>
</body>

</html>
